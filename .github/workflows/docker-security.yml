---
name: Docker Security

"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      images-json: ${{ steps.images.outputs.images-json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read image references
        id: images
        run: |
          PINGVIN_RE='^ghcr.io/smp46/pingvin-share-x:'
          PINGVIN_IMAGE="$(
            awk -v pattern="$PINGVIN_RE" \
              '$2 ~ pattern { print $2; exit }' \
              docker-compose.yml
          )"
          CADDY_RE='^caddy:'
          CADDY_IMAGE="$(
            awk -v pattern="$CADDY_RE" \
              '$2 ~ pattern { print $2; exit }' \
              docker-compose.yml
          )"

          if [ -z "$PINGVIN_IMAGE" ] || [ -z "$CADDY_IMAGE" ]; then
            echo "::error::Could not find required image references."
            exit 1
          fi

          images_json="$(
            jq -cn \
              --arg pingvin "$PINGVIN_IMAGE" \
              --arg caddy "$CADDY_IMAGE" \
              '[
                {
                  name: "Pingvin Share X",
                  image: $pingvin,
                  category: "container-pingvin-share-x",
                  pkg_types: "os,library"
                },
                {
                  name: "Caddy",
                  image: $caddy,
                  category: "container-caddy",
                  pkg_types: "os"
                }
              ]'
          )"

          echo "images-json=${images_json}" >> "$GITHUB_OUTPUT"

  security:
    needs: images
    uses: oszuidwest/.github-templates/.github/workflows/docker-security-images.yml@main  # yamllint disable-line rule:line-length
    with:
      images-json: ${{ needs.images.outputs.images-json }}
      event-name: ${{ github.event_name }}
      repository-private: ${{ github.event.repository.private }}
