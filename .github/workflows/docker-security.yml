---
name: Docker Security

"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read image references
        id: images
        run: |
          PINGVIN_RE='^ghcr.io/smp46/pingvin-share-x:'
          PINGVIN_IMAGE="$(
            awk -v pattern="$PINGVIN_RE" \
              '$2 ~ pattern { print $2; exit }' \
              docker-compose.yml
          )"
          CADDY_RE='^caddy:'
          CADDY_IMAGE="$(
            awk -v pattern="$CADDY_RE" \
              '$2 ~ pattern { print $2; exit }' \
              docker-compose.yml
          )"

          echo "pingvin=${PINGVIN_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "caddy=${CADDY_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Trivy SARIF report for Pingvin Share X
        if: >-
          github.event_name != 'pull_request' &&
          github.event.repository.private == false
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.pingvin }}
          format: sarif
          output: trivy-pingvin-share-x.sarif
          severity: CRITICAL,HIGH
          scanners: vuln,secret
          ignore-unfixed: true
          exit-code: "0"
          limit-severities-for-sarif: true

      - name: Upload Pingvin SARIF
        if: >-
          github.event_name != 'pull_request' &&
          github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-pingvin-share-x.sarif
          category: container-pingvin-share-x

      - name: Trivy high/critical summary for Pingvin
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.pingvin }}
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln,secret
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy SARIF report for Caddy
        if: >-
          github.event_name != 'pull_request' &&
          github.event.repository.private == false
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.caddy }}
          format: sarif
          output: trivy-caddy.sarif
          severity: CRITICAL,HIGH
          scanners: vuln,secret
          vuln-type: os
          ignore-unfixed: true
          exit-code: "0"
          limit-severities-for-sarif: true

      - name: Upload Caddy SARIF
        if: >-
          github.event_name != 'pull_request' &&
          github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-caddy.sarif
          category: container-caddy

      - name: Trivy high/critical summary for Caddy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.caddy }}
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln,secret
          vuln-type: os
          ignore-unfixed: true
          exit-code: "0"
