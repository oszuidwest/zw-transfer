name: Check Pingvin Share X Release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-pingvin-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get current Pingvin Share X version
        id: current-version
        run: |
          CURRENT_VERSION="$(grep -oP 'ghcr.io/smp46/pingvin-share-x:\Kv[0-9.]+' docker-compose.yml)"
          echo "Current version: ${CURRENT_VERSION}"
          echo "version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Get latest Pingvin Share X version
        id: latest-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_VERSION="$(gh api repos/smp46/pingvin-share-x/releases/latest --jq '.tag_name')"
          echo "Latest version: ${LATEST_VERSION}"
          echo "version=${LATEST_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          CURRENT_VERSION="${{ steps.current-version.outputs.version }}"
          LATEST_VERSION="${{ steps.latest-version.outputs.version }}"

          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "Update needed from ${CURRENT_VERSION} to ${LATEST_VERSION}"
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No update needed"
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          fi

      # Upstream publishes the GitHub release before the image build finishes,
      # so a "new tag" can race ahead of the GHCR manifest. Skip gracefully
      # when that happens; the next scheduled run will pick it up.
      - name: Check image availability
        if: steps.compare.outputs.update_needed == 'true'
        id: image
        env:
          VERSION: ${{ steps.latest-version.outputs.version }}
        run: |
          set -euo pipefail
          token="$(curl -fsS 'https://ghcr.io/token?service=ghcr.io&scope=repository:smp46/pingvin-share-x:pull' | jq -r '.token')"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/smp46/pingvin-share-x/manifests/${VERSION}")"
          case "$status" in
            200)
              echo "GHCR image ghcr.io/smp46/pingvin-share-x:${VERSION} is available"
              echo "available=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "::warning::Release ${VERSION} is published but the GHCR image is not available yet; will retry on next scheduled run."
              echo "available=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected status ${status} from GHCR manifest endpoint for ${VERSION}" >&2
              exit 1
              ;;
          esac

      - name: Update docker-compose.yml
        if: steps.compare.outputs.update_needed == 'true' && steps.image.outputs.available == 'true'
        run: |
          CURRENT_VERSION="${{ steps.current-version.outputs.version }}"
          LATEST_VERSION="${{ steps.latest-version.outputs.version }}"

          sed -i "s|ghcr.io/smp46/pingvin-share-x:${CURRENT_VERSION}|ghcr.io/smp46/pingvin-share-x:${LATEST_VERSION}|g" docker-compose.yml

      - name: Regenerate email patch
        if: steps.compare.outputs.update_needed == 'true' && steps.image.outputs.available == 'true'
        run: ./scripts/regenerate-email-patch.sh

      - name: Validate Compose
        if: steps.compare.outputs.update_needed == 'true' && steps.image.outputs.available == 'true'
        run: ./scripts/validate-pingvin-config.sh

      - name: Open pull request
        if: steps.compare.outputs.update_needed == 'true' && steps.image.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.latest-version.outputs.version }}
        run: |
          branch="automation/pingvin-share-x-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add docker-compose.yml patches/email.service.js
          git commit -m "chore(deps): update Pingvin Share X to ${VERSION}"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "$branch"

          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Pull request #${existing} already exists"
            exit 0
          fi

          gh pr create \
            --title "Update Pingvin Share X to ${VERSION}" \
            --body "Updates the pinned Pingvin Share X image to ${VERSION} and validates the Docker Compose configuration." \
            --base "${GITHUB_REF_NAME}" \
            --head "$branch"
