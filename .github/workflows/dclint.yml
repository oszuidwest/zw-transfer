name: Docker Compose linter

on:
  push:
    branches:
      - main
    paths:
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/validate-pingvin-config.sh"
      - ".github/workflows/dclint.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/validate-pingvin-config.sh"
      - ".github/workflows/dclint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install DCLint
        run: npm install -g dclint

      - name: Run DCLint
        run: dclint .

      - name: Validate rendered Pingvin config
        run: ./scripts/validate-pingvin-config.sh
