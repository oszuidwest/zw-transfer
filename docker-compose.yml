name: "${COMPOSE_PROJECT_NAME:-zw-transfer}"

services:
  caddy:
    image: caddy:alpine
    container_name: zw-transfer-caddy
    depends_on:
      - pingvin
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      APP_HOSTNAME: "${APP_HOSTNAME:-transfer.example.org}"
    ports:
      - '${HTTP_BIND:-0.0.0.0}:80:80'
      - '${HTTPS_BIND:-0.0.0.0}:443:443'
    networks:
      - backend
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  pingvin:
    image: ghcr.io/smp46/pingvin-share-x:v1.17.0
    container_name: zw-transfer
    volumes:
      - pingvin_data:/opt/app/backend/data
      - ./patches/email.service.js:/opt/app/backend/dist/src/email/email.service.js:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    configs:
      - source: pingvin_config
        target: /opt/app/config.yaml
    environment:
      CONFIG_FILE: /opt/app/config.yaml
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    ports:
      - '${PINGVIN_BIND:-127.0.0.1}:3000:3000'
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    name: "${BACKEND_NETWORK_NAME:-zw-transfer-backend}"

volumes:
  caddy_data:
    name: "${CADDY_DATA_VOLUME:-zw-transfer-caddy-data}"
  caddy_config:
    name: "${CADDY_CONFIG_VOLUME:-zw-transfer-caddy-config}"
  pingvin_data:
    name: "${PINGVIN_DATA_VOLUME:-zw-transfer-pingvin-data}"

configs:
  pingvin_config:
    content: |
      general:
        appName: "${APP_NAME:-ZuidWest Transfer}"
        appUrl: "${APP_URL:-https://transfer.example.org}"
        secureCookies: "${SECURE_COOKIES:-true}"
        showHomePage: "${SHOW_HOME_PAGE:-false}"
        sessionDuration: "${SESSION_DURATION:-3 months}"

      appearance:
        customCss: "${CUSTOM_CSS:-footer, div[data-with-border=true]:has(input[type=password]), div[data-with-border=true]:has([id*=-tab-totp]), div[data-with-border=true]:has([id*=-tab-oidc]), .mantine-Group-root:has(input[placeholder=myAwesomeShare]), .mantine-Group-root:has(input[placeholder=myAwesomeShare]) + .mantine-Text-root { display: none !important; } [id*=-panel-recipients] { display: block !important; height: auto !important; overflow: visible !important; } [id*=-panel-recipients] > div { opacity: 1 !important; }}"

      share:
        allowRegistration: "${SHARE_ALLOW_REGISTRATION:-false}"
        allowUnauthenticatedShares: "${SHARE_ALLOW_UNAUTHENTICATED_SHARES:-false}"
        maxSize: "${SHARE_MAX_SIZE:-1000000000000}"

      email:
        enableShareEmailRecipients: "${EMAIL_ENABLE_SHARE_RECIPIENTS:-true}"
        shareRecipientsSubject: "${EMAIL_SHARE_RECIPIENTS_SUBJECT:-Er staan bestanden voor je klaar}"
        resetPasswordSubject: "${EMAIL_RESET_PASSWORD_SUBJECT:-Stel je wachtwoord opnieuw in}"
        inviteSubject: "${EMAIL_INVITE_SUBJECT:-Welkom bij ${APP_NAME:-ZuidWest Transfer}}"
        reverseShareSubject: "${EMAIL_REVERSE_SHARE_SUBJECT:-Nieuwe bestanden via je aanvraaglink}"
        shareRecipientsMessage: "${EMAIL_SHARE_RECIPIENTS_MESSAGE:-Hoi,\n\n{creator} heeft bestanden voor je klaargezet via ${APP_NAME:-ZuidWest Transfer}.\n\nDownload hier:\n{shareUrl}\n\nDe link verloopt {expires}{descBlock}\n\nVerwacht je dit bericht niet? Klik niet op de link en neem contact op met {creatorEmail}.\n\n—\nZuidWest Transfer\nEuropese servers, veilig versleuteld, geen AI-voer. 🇪🇺🫡}"
        resetPasswordMessage: "${EMAIL_RESET_PASSWORD_MESSAGE:-Hoi,\n\nStel hier je nieuwe wachtwoord voor ${APP_NAME:-ZuidWest Transfer} in:\n{url}\n\nDe link werkt een uur. Niet zelf aangevraagd? Negeer dit bericht.\n\n—\nZuidWest Transfer\nEuropese servers, veilig versleuteld, geen AI-voer. 🇪🇺🫡}"
        inviteMessage: "${EMAIL_INVITE_MESSAGE:-Hoi,\n\nJe hebt toegang gekregen tot ${APP_NAME:-ZuidWest Transfer}. Accepteer je uitnodiging:\n{url}\n\nLog in met {email} en het tijdelijke wachtwoord: {password}\n\nWijzig je wachtwoord direct na de eerste keer inloggen.\n\n—\nZuidWest Transfer\nEuropese servers, veilig versleuteld, geen AI-voer. 🇪🇺🫡}"
        reverseShareMessage: "${EMAIL_REVERSE_SHARE_MESSAGE:-Hoi,\n\nEr staan nieuwe bestanden klaar via je aanvraaglink:\n{shareUrl}\n\n—\nZuidWest Transfer\nEuropese servers, veilig versleuteld, geen AI-voer. 🇪🇺🫡}"

      smtp:
        enabled: "${SMTP_ENABLED:-false}"
        allowUnauthorizedCertificates: "${SMTP_ALLOW_UNAUTHORIZED_CERTIFICATES:-false}"
        host: "${SMTP_HOST:-smtp.example.org}"
        port: "${SMTP_PORT:-587}"
        email: "${SMTP_EMAIL:-transfer@example.org}"
        username: "${SMTP_USERNAME:-transfer@example.org}"
        password: "${SMTP_PASSWORD:-}"

      oauth:
        allowRegistration: "${OAUTH_ALLOW_REGISTRATION:-true}"
        ignoreTotp: "${OAUTH_IGNORE_TOTP:-true}"
        disablePassword: "${OAUTH_DISABLE_PASSWORD:-true}"
        oidc-enabled: "${OIDC_ENABLED:-false}"
        oidc-discoveryUri: "${OIDC_DISCOVERY_URI:-}"
        oidc-signOut: "${OIDC_SIGN_OUT:-true}"
        oidc-scope: "${OIDC_SCOPE:-openid email profile}"
        oidc-usernameClaim: "${OIDC_USERNAME_CLAIM:-name}"
        oidc-rolePath: "${OIDC_ROLE_PATH:-}"
        oidc-roleGeneralAccess: "${OIDC_ROLE_GENERAL_ACCESS:-}"
        oidc-roleAdminAccess: "${OIDC_ROLE_ADMIN_ACCESS:-}"
        oidc-clientId: "${OIDC_CLIENT_ID:-}"
        oidc-clientSecret: "${OIDC_CLIENT_SECRET:-}"

      initUser:
        enabled: ${INIT_USER_ENABLED:-false}
        username: "${INIT_USER_USERNAME:-admin}"
        email: "${INIT_USER_EMAIL:-admin@example.com}"
        password: "${INIT_USER_PASSWORD:-}"
        isAdmin: ${INIT_USER_IS_ADMIN:-true}
        ldapDN: "${INIT_USER_LDAP_DN:-}"
